name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirement.txt

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirement.txt
          pip install ruff

      - name: Lint
        run: ruff check .
