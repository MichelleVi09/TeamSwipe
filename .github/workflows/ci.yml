name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirement.txt

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirement.txt
          pip install ruff pytest

      - name: Lint
        run: ruff check .

      - name: Tests
        env:
          FLASK_SECRET_KEY: ci-secret
          MONGODB_URI: mongodb://localhost:27017
          TWITCH_CLIENT_ID: ci-client
          TWITCH_CLIENT_SECRET: ci-secret
        run: pytest -q
